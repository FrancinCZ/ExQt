name: exqt-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pyside6 >=6.4.0
  - napari >=0.4.18
  - numpy >=1.23.0,<2.0.0
  - pandas >=1.5.0
  - scipy >=1.9.0
  - scikit-image >=0.19.0
  - tifffile
  - openpyxl
  - pillow
  - matplotlib
  - seaborn
  - pip
  - pip:
    - pyqtdarktheme
